<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather Widget</title>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: var(--font-sans, system-ui, -apple-system, sans-serif);
        background: var(--color-background-primary, #ffffff);
        color: var(--color-text-primary, #1a1a1a);
        padding: 16px;
        line-height: 1.5;
    }

    .card {
        border: 1px solid var(--color-border-primary, #e0e0e0);
        border-radius: var(--border-radius-lg, 12px);
        padding: 20px;
        max-width: 380px;
    }

    .header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        margin-bottom: 16px;
    }

    .city {
        font-size: var(--font-heading-md-size, 1.25rem);
        font-weight: var(--font-weight-semibold, 600);
        color: var(--color-text-primary, #1a1a1a);
    }

    .condition {
        font-size: var(--font-text-sm-size, 0.875rem);
        color: var(--color-text-secondary, #666);
        margin-top: 2px;
    }

    .condition-icon {
        font-size: 2rem;
        line-height: 1;
    }

    .temperature {
        font-size: 3rem;
        font-weight: var(--font-weight-bold, 700);
        color: var(--color-text-primary, #1a1a1a);
        margin-bottom: 16px;
        line-height: 1.1;
    }

    .temperature .unit {
        font-size: 1.25rem;
        font-weight: var(--font-weight-normal, 400);
        color: var(--color-text-secondary, #666);
        vertical-align: super;
    }

    .stats {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-bottom: 16px;
    }

    .stat {
        padding: 8px 10px;
        background: var(--color-background-secondary, #f5f5f5);
        border-radius: var(--border-radius-md, 8px);
    }

    .stat-label {
        font-size: var(--font-text-xs-size, 0.75rem);
        color: var(--color-text-tertiary, #999);
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }

    .stat-value {
        font-size: var(--font-text-md-size, 1rem);
        font-weight: var(--font-weight-medium, 500);
        color: var(--color-text-primary, #1a1a1a);
    }

    .actions {
        display: flex;
        gap: 8px;
    }

    .btn {
        flex: 1;
        padding: 8px 14px;
        border: 1px solid var(--color-border-primary, #e0e0e0);
        border-radius: var(--border-radius-md, 8px);
        background: var(--color-background-primary, #ffffff);
        color: var(--color-text-primary, #1a1a1a);
        font-size: var(--font-text-sm-size, 0.875rem);
        font-family: inherit;
        cursor: pointer;
        transition: background 0.15s;
    }

    .btn:hover {
        background: var(--color-background-secondary, #f5f5f5);
    }

    .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }

    .timestamp {
        margin-top: 12px;
        font-size: var(--font-text-xs-size, 0.75rem);
        color: var(--color-text-tertiary, #999);
        text-align: right;
    }

    .loading {
        text-align: center;
        padding: 40px 20px;
        color: var(--color-text-secondary, #666);
    }

    .error {
        padding: 12px;
        background: var(--color-background-danger, #fef2f2);
        color: var(--color-text-danger, #dc2626);
        border-radius: var(--border-radius-md, 8px);
        font-size: var(--font-text-sm-size, 0.875rem);
    }
</style>
</head>
<body>
<div id="root" class="loading">Waiting for weather data...</div>

<script>
/**
 * McpApp -- lightweight MCP Apps protocol helper (vanilla JS, zero dependencies).
 *
 * Handles the JSON-RPC over postMessage communication between this widget
 * (running in a sandboxed iframe) and the MCP host.
 *
 * Protocol flow:
 *   1. Widget sends ui/initialize REQUEST to the host (with appInfo, appCapabilities)
 *   2. Host responds with hostInfo, hostCapabilities, hostContext
 *   3. Widget sends ui/notifications/initialized notification
 *   4. Host sends notifications: tool-input, tool-result, host-context-changed, etc.
 *   5. Widget can send tools/call requests to invoke server tools (e.g., refresh)
 *   6. Host sends ui/resource-teardown request before unmounting
 */
class McpApp {
    constructor (appInfo, appCapabilities) {
        this._appInfo = appInfo
        this._appCapabilities = appCapabilities || {}
        this._id = 1
        this._pending = new Map()
        this._hostContext = null
        this.ontoolresult = null
        this.ontoolinput = null
        this.onhostcontext = null
        this.ontoolcancelled = null
        this.onteardown = null
        window.addEventListener('message', (e) => this._handle(e))
    }

    _send (msg) {
        window.parent.postMessage(msg, '*')
    }

    _request (method, params) {
        const id = this._id++
        return new Promise((resolve, reject) => {
            this._pending.set(id, { resolve, reject })
            this._send({ jsonrpc: '2.0', method, params, id })
        })
    }

    _handle (event) {
        const msg = event.data
        if (!msg || msg.jsonrpc !== '2.0') return

        // Handle responses to our requests (ui/initialize, tools/call, etc.)
        if (msg.id !== undefined && this._pending.has(msg.id)) {
            const { resolve, reject } = this._pending.get(msg.id)
            this._pending.delete(msg.id)
            if ('error' in msg) {
                reject(msg.error)
            } else {
                resolve(msg.result)
            }
            return
        }

        // Handle notifications from host (no id, no response needed)
        if (msg.method && msg.id === undefined) {
            switch (msg.method) {
            case 'ui/notifications/tool-result':
                if (this.ontoolresult) this.ontoolresult(msg.params)
                break
            case 'ui/notifications/tool-input':
                if (this.ontoolinput) this.ontoolinput(msg.params)
                break
            case 'ui/notifications/tool-input-partial':
                break
            case 'ui/notifications/host-context-changed':
                this._hostContext = msg.params
                if (this.onhostcontext) this.onhostcontext(msg.params)
                break
            case 'ui/notifications/tool-cancelled':
                if (this.ontoolcancelled) this.ontoolcancelled(msg.params)
                break
            }
            return
        }

        // Handle requests from host (have id, need response)
        if (msg.method && msg.id !== undefined) {
            if (msg.method === 'ui/resource-teardown') {
                if (this.onteardown) this.onteardown()
                this._send({ jsonrpc: '2.0', id: msg.id, result: {} })
            }
        }
    }

    /**
     * Connect to the host by sending ui/initialize and completing the handshake.
     * Call this after registering all handlers (ontoolresult, ontoolinput, etc.).
     */
    async connect () {
        const result = await this._request('ui/initialize', {
            protocolVersion: '2026-01-26',
            appInfo: this._appInfo,
            appCapabilities: this._appCapabilities
        })

        // Store host context from the initialize response
        if (result && result.hostContext) {
            this._hostContext = result.hostContext
            if (this.onhostcontext) this.onhostcontext(result.hostContext)
        }

        // Notify host that initialization is complete
        this._send({
            jsonrpc: '2.0',
            method: 'ui/notifications/initialized',
            params: {}
        })

        return result
    }

    /**
     * Call a server-side tool (proxied through the host).
     */
    callTool (name, args) {
        return this._request('tools/call', { name, arguments: args })
    }

    getHostContext () {
        return this._hostContext
    }
}

// --- Weather Widget Logic ---

const CONDITION_ICONS = {
    Sunny: '☀️', Clear: '☀️',
    'Partly Cloudy': '⛅', Cloudy: '☁️', Overcast: '☁️',
    'Light Rain': '🌧️', 'Scattered Showers': '🌦️', Drizzle: '🌧️'
}

let currentCity = null

function render (data) {
    const icon = CONDITION_ICONS[data.condition] || '🌤️'
    const ts = data.timestamp ? new Date(data.timestamp).toLocaleString() : ''

    document.getElementById('root').innerHTML = `
        <div class="card">
            <div class="header">
                <div>
                    <div class="city">${escapeHtml(data.city)}</div>
                    <div class="condition">${escapeHtml(data.condition)}</div>
                </div>
                <div class="condition-icon">${icon}</div>
            </div>
            <div class="temperature">${data.temperature}<span class="unit">°C</span></div>
            <div class="stats">
                <div class="stat">
                    <div class="stat-label">Humidity</div>
                    <div class="stat-value">${data.humidity}%</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Wind</div>
                    <div class="stat-value">${data.windSpeed} km/h</div>
                </div>
                <div class="stat">
                    <div class="stat-label">Pressure</div>
                    <div class="stat-value">${data.pressure} hPa</div>
                </div>
                <div class="stat">
                    <div class="stat-label">UV Index</div>
                    <div class="stat-value">${data.uvIndex}</div>
                </div>
            </div>
            <div class="actions">
                <button class="btn" id="refresh-btn">Refresh</button>
            </div>
            <div class="timestamp">Updated: ${escapeHtml(ts)}</div>
        </div>
    `

    document.getElementById('refresh-btn').addEventListener('click', handleRefresh)
}

function renderError (message) {
    document.getElementById('root').innerHTML = `
        <div class="card">
            <div class="error">${escapeHtml(message)}</div>
            ${currentCity ? '<div class="actions" style="margin-top:12px"><button class="btn" id="refresh-btn">Retry</button></div>' : ''}
        </div>
    `
    const btn = document.getElementById('refresh-btn')
    if (btn) btn.addEventListener('click', handleRefresh)
}

async function handleRefresh () {
    if (!currentCity) return
    const btn = document.getElementById('refresh-btn')
    if (btn) { btn.disabled = true; btn.textContent = 'Loading...' }

    try {
        const result = await app.callTool('weather', { city: currentCity })
        if (result && result.structuredContent) {
            currentCity = result.structuredContent.city || currentCity
            render(result.structuredContent)
        } else if (result && result.content) {
            const text = result.content.find(c => c.type === 'text')?.text || ''
            document.getElementById('root').innerHTML = `<div class="card"><pre style="white-space:pre-wrap">${escapeHtml(text)}</pre></div>`
        }
    } catch (err) {
        renderError('Failed to refresh weather data.')
    }
}

function escapeHtml (str) {
    if (!str) return ''
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;')
}

// Initialize the app -- register all handlers before calling connect()
const app = new McpApp({ name: 'Weather Widget', version: '1.0.0' })

app.ontoolresult = (params) => {
    if (params.isError) {
        renderError('Weather data unavailable.')
        return
    }
    if (params.structuredContent) {
        currentCity = params.structuredContent.city || currentCity
        render(params.structuredContent)
    } else if (params.content) {
        const text = params.content.find(c => c.type === 'text')?.text || ''
        document.getElementById('root').innerHTML = `<div class="card"><pre style="white-space:pre-wrap">${escapeHtml(text)}</pre></div>`
    }
}

app.ontoolinput = (params) => {
    if (params.arguments?.city) {
        currentCity = params.arguments.city
    }
}

app.ontoolcancelled = (params) => {
    renderError(`Request cancelled${params.reason ? ': ' + params.reason : ''}.`)
}

app.onhostcontext = (ctx) => {
    // Theme is handled automatically via CSS custom properties injected by the host.
    // Add custom logic here if needed.
}

// Connect to the host (sends ui/initialize, completes handshake)
app.connect().catch((err) => {
    console.error('McpApp connect failed:', err)
})
</script>
</body>
</html>
